name: Bug report
description: Report a reproducible problem in StackRunway
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve StackRunway. Do not include private financial data or exported JSON contents.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Add…\n3. Select…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 26.0, Chrome 140, Firefox 142
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - GitHub Pages
        - Downloaded index.html
        - Forked copy
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add a screenshot if useful. Remove account balances and other private information first.
