name: Feature request
description: Propose a focused improvement to StackRunway
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What problem should StackRunway solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing an implementation.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: This can preserve local-only data and the no-login model.
          required: true
        - label: This can preserve the downloadable single-file edition.
          required: true
